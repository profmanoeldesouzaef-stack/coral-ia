name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # ativa pipefail: erro antes do "| tee" falha o passo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar e ajustar projeto Android
        working-directory: mobile
        run: |
          flutter --version 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          flutter create --platforms=android --org com.coralia --project-name coral_ia . 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          rm -f test/widget_test.dart
          bash ../scripts/patch_android.sh 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Dependências
        working-directory: mobile
        run: flutter pub get 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Análise estática
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Testes
        working-directory: mobile
        run: flutter test 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release --split-per-abi 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Publicar APK no branch "apk"
        run: |
          mkdir -p /tmp/apk && cp mobile/build/app/outputs/flutter-apk/app-*-release.apk /tmp/apk/
          cd /tmp/apk && git init -q -b apk && git add . \
            && git -c user.name=ci -c user.email=ci@local commit -qm "APK ${GITHUB_SHA::7}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk

      - name: Publicar log no branch "build-status"
        if: always()
        run: |
          mkdir -p /tmp/status && cp build.log /tmp/status/ 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA}" > /tmp/status/STATUS
          cd /tmp/status && git init -q -b build-status && git add . \
            && git -c user.name=ci -c user.email=ci@local commit -qm "status ${GITHUB_SHA::7}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-status
